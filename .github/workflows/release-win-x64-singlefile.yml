name: release-win-x64-singlefile

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    # A Korean patch release (tag kopatch-...) ships the patch zip only, not the translator.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'kopatch-')
    runs-on: windows-latest
    # A release takes 3 to 5 minutes (tests, the single-file publish, the uploads). Without a limit a hung test run would go on
    # for 6 hours; this leaves room for a slow runner.
    timeout-minutes: 45
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:EVENT_NAME -eq "release") {
            $tag = $env:EVENT_RELEASE_TAG
          }
          else {
            $tag = $env:INPUT_RELEASE_TAG
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "A release tag is required."
          }
          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid release tag."
          }
          "value=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved release tag: $tag"

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.value }}

      - name: Verify checked-out release commit
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: |
          $headCommit = git rev-parse --verify 'HEAD^{commit}'
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve HEAD." }
          $tagCommit = git rev-parse --verify "refs/tags/${env:RELEASE_TAG}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve release tag." }
          if ($headCommit -ne $tagCommit) { throw "Checkout does not match the release tag." }
          Write-Host "Building release commit: $headCommit"
          # A release made before its version commit was pushed tags the previous commit, and its zip shipped the
          # previous version's EXE and kit under the new name. A Korean patch tag given by hand stops here too.
          $version = (Select-Xml -Path 'src/XTranslatorAi.App/XTranslatorAi.App.csproj' -XPath '//Version').Node.InnerText | Select-Object -First 1
          if ($version -ne $env:RELEASE_TAG) { throw "Release tag $env:RELEASE_TAG does not match the app version $version in XTranslatorAi.App.csproj." }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Ensure release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY

      - name: Restore app (win-x64)
        shell: pwsh
        run: |
          dotnet restore src/XTranslatorAi.App/XTranslatorAi.App.csproj -r win-x64 -p:EnableWindowsTargeting=true

      - name: Restore tests
        shell: pwsh
        run: |
          dotnet restore tests/XTranslatorAi.Tests/XTranslatorAi.Tests.csproj

      - name: Run tests
        shell: pwsh
        run: dotnet test tests/XTranslatorAi.Tests/XTranslatorAi.Tests.csproj --configuration Release --no-restore

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          dotnet publish src/XTranslatorAi.App/XTranslatorAi.App.csproj -c Release -r win-x64 -o artifacts/current -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:EnableWindowsTargeting=true -p:DeleteExistingFiles=true

      - name: Generate SHA256
        shell: pwsh
        run: |
          $exe = "artifacts/current/TulliusTranslator.exe"
          if (!(Test-Path $exe)) {
            throw "Missing executable: $exe"
          }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TulliusTranslator.exe" | Out-File -FilePath "artifacts/current/TulliusTranslator.exe.sha256" -Encoding ascii

      # The translator and its agent kit in one zip, so the kit lands beside the EXE where .mcp.json and
      # tullius.cmd look for it; the kit alone stays for those who followed the earlier two-file instructions.
      - name: Package EXE with agent kit
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: |
          # The checkout holds only the kit's tracked files (no work or output folders).
          $stage = "$PWD/artifacts/package"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Path "agent-kit" -Destination $stage -Recurse -Force
          Copy-Item "artifacts/current/TulliusTranslator.exe" "$stage/TulliusTranslator.exe"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, "$PWD/artifacts/current/TulliusTranslator-$($env:RELEASE_TAG).zip")
          [System.IO.Compression.ZipFile]::CreateFromDirectory("$stage/agent-kit", "$PWD/artifacts/current/TulliusTranslator-agent-kit.zip", [System.IO.Compression.CompressionLevel]::Optimal, $true)
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/artifacts/current/TulliusTranslator-$($env:RELEASE_TAG).zip")
          $names = $zip.Entries.FullName; $zip.Dispose()
          $names
          if ($names -notcontains "TulliusTranslator.exe" -or $names -notcontains "agent-kit/.mcp.json") { throw "The zip is missing the EXE or the kit." }

      - name: Upload assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload $env:RELEASE_TAG `
            "artifacts/current/TulliusTranslator.exe" `
            "artifacts/current/TulliusTranslator.exe.sha256" `
            "artifacts/current/TulliusTranslator-$($env:RELEASE_TAG).zip" `
            "artifacts/current/TulliusTranslator-agent-kit.zip" `
            --clobber `
            --repo $env:RELEASE_REPOSITORY

      - name: Show release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG `
            --json assets `
            --jq ".assets[].name" `
            --repo $env:RELEASE_REPOSITORY
