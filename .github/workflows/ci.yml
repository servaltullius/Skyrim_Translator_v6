name: ci

# Build and test every push to main and every pull request, so a failing test
# or a new compiler warning (warnings are errors) shows up before a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    # A run takes about 3 minutes (12 on a slow runner). Without a limit a hung test run would go on for 6 hours: a UI
    # test may run a minute before it fails as hung (TestEnvironment.UiTestLimit).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Rows waiting for the bundled TM's next seed version stop a release (release-win-x64-singlefile.yml), but only
      # after the release is published; this warns on every push while any wait, so the seed is cut before publishing.
      - name: Warn of waiting TM rows
        shell: pwsh
        run: |
          $pendingPath = 'src/XTranslatorAi.App/Assets/TmSeeds/skyrim-tes-franchise-tm-pending.tsv'
          if (Test-Path $pendingPath) {
            $pending = @(Get-Content $pendingPath | Select-Object -Skip 1 | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($pending.Count -gt 0) {
              Write-Output "::warning file=$pendingPath::$($pending.Count) bundled TM rows wait for the next seed version; a release stops until they are taken in."
            }
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore tests/XTranslatorAi.Tests/XTranslatorAi.Tests.csproj

      - name: Test
        shell: pwsh
        run: dotnet test tests/XTranslatorAi.Tests/XTranslatorAi.Tests.csproj --configuration Release --no-restore

      - name: Build tools
        shell: pwsh
        run: |
          dotnet build tools/XTranslatorAi.TranslationBenchmark/XTranslatorAi.TranslationBenchmark.csproj --configuration Release
          dotnet build tools/XTranslatorAi.Validate/XTranslatorAi.Validate.csproj --configuration Release
